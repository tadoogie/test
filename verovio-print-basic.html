<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verovio MIDI Player</title>
  <link href="https://book.verovio.org/tutorials/midi.css" rel="stylesheet" type="text/css" />
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
  <script src="js/pdfkit.standalone.js" type="text/javascript"></script>
  <script src="js/blob-stream.js" type="text/javascript"></script>
  <script src="js/svg-to-pdfkit.js" type="text/javascript"></script>
  <script src="pdf_generator.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #notation {
      border: 1px solid #ccc;
      margin-top: 20px;
      overflow-x: auto; /* For horizontal scrolling if content is wider */
    }
    .playing {
      fill: #ff0000; /* Highlight notes in red */
      stroke: #ff0000;
    }
  </style>
</head>
<body>
  <h1>Hello Verovio!</h1>
  <button id="playMIDI">Play</button>
  <button id="stopMIDI">Stop</button>
  <button id="printPDF">Print</button>
  <midi-player id="verovio-midi-player" sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus" controls="false">
            </midi-player>
  <div id="notation"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let tk = null; // Declare tk outside to make it accessible

      const player = document.querySelector('#verovio-midi-player');

      const printPdfButton = document.getElementById('printPDF');
      const playMIDI = document.getElementById('playMIDI');
      const stopMIDI = document.getElementById('stopMIDI');

      verovio.module.onRuntimeInitialized = () => {
        tk = new verovio.toolkit();

        // Set options for Verovio
        tk.setOptions({
          pageWidth: document.body.clientWidth,
          pageHeight: window.innerHeight - 100,
          scale: 70,
          scaleToPageSize: true
        });

        let currentPage = 1;

        // --- Event Handlers ---
        const playMIDIHandler = () => {
          let base64midi = tk.renderToMIDI();
          console.log("Verovio MIDI data length:", base64midi.length);
          console.log("Verovio MIDI data (first 50 chars):", base64midi.substring(0, 50));
          player.src = 'data:audio/midi;base64,' + base64midi;
          player.start();
        };

        const stopMIDIHandler = () => {
          player.stop();
          // Remove highlighting when stopped
          document.querySelectorAll('g.note.playing').forEach(note => {
            note.classList.remove("playing");
          });
        };

        const midiHighlightingHandler = (event) => {
          // Clear previous highlighting
          document.querySelectorAll('g.note.playing').forEach(playingNote => {
            playingNote.classList.remove("playing");
          });

          let currentElements = tk.getElementsAtTime(event.time * 1000); // Verovio expects milliseconds

          // Handle page changes during playback
          if (currentElements.page > 0 && currentElements.page !== currentPage) {
            currentPage = currentElements.page;
            document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);
          }
          
          // Apply highlighting to current notes
          for (let noteId of currentElements.notes) {
            let noteElement = document.getElementById(noteId);
            if (noteElement) {
              noteElement.classList.add("playing");
            }
          }
        };

        // --- Load MEI Data and Render SVG ---
        fetch("https://www.verovio.org/examples/downloads/Schubert_Lindenbaum.mei")
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then(meiXML => {
            tk.loadData(meiXML);
            // Render the initial SVG
            document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);

            // --- Attach Event Listeners and Callbacks after data is loaded ---
            playMIDI.addEventListener("click", playMIDIHandler);
            stopMIDI.addEventListener("click", stopMIDIHandler);
            player.addEventListener('timeupdate', midiHighlightingHandler); // This is the crucial change

          

if (printPdfButton) {
    printPdfButton.addEventListener('click', async () => {
        console.log("Print Preview PDF button clicked (client-side Verovio PDF).");

        // Ensure Verovio Toolkit (tk) is initialized and MEI data is loaded
        if (!tk || typeof tk.renderToPDF !== 'function' || tk.getMEI() === '') {
            alert("Verovio is not ready or does not support PDF rendering, or no MEI data loaded. Please check your Verovio Toolkit version.");
            console.error("Verovio Toolkit issues. Is 'tk.renderToPDF' a function? Is MEI loaded?");
            return;
        }

        const currentMEI = meiXML; // Get the current MEI XML string from the toolkit

        try {
            console.log("Generating PDF using Verovio Toolkit...");

            // Use tk.renderToPDF() directly.
            // This method returns an ArrayBuffer containing the PDF data.
            const pdfArrayBuffer = await tk.renderToPDF(currentMEI, {
                // You can add Verovio rendering options here for PDF output.
                // These are similar to those for SVG, but tailored for print layout.
                // Examples to consider for print quality:
                // scale: 40,        // Adjust overall scaling for print
                // pageWidth: 1000,  // Verovio units (e.g., 1000 for standard score width)
                // pageHeight: 1500, // Verovio units (e.g., 1500 for standard score height)
                // page: 'all',      // Very important: Renders ALL pages of the score for the PDF
                // adjustPageHeight: true, // Adjusts page height to fit content if true
                // header: 1,        // Add page numbers in the header
                // footer: 1         // Add page numbers in the footer
                page: all,
                footer: 1
            });

            console.log("PDF ArrayBuffer generated. Size:", pdfArrayBuffer.byteLength, "bytes.");

            // Convert the ArrayBuffer to a Blob
            const pdfBlob = new Blob([pdfArrayBuffer], { type: 'application/pdf' });

            // Create a temporary URL for the Blob
            const pdfUrl = URL.createObjectURL(pdfBlob);

            // Create a temporary link element to trigger the download
            const a = document.createElement('a');
            a.href = pdfUrl;
            a.download = 'music_score_verovio.pdf'; // Suggested filename
            document.body.appendChild(a); // Append to body (required for Firefox to trigger click)
            a.click(); // Programmatically click the link to start download
            document.body.removeChild(a); // Clean up the temporary link
            URL.revokeObjectURL(pdfUrl); // Release the temporary URL resource

            console.log("PDF 'music_score_verovio.pdf' downloaded.");

        } catch (error) {
            console.error("Error generating PDF with Verovio Toolkit:", error);
            alert("Failed to generate PDF. Please ensure your Verovio Toolkit version supports PDF rendering and check the console for details.");
        }
    });
}


            console.log("Verovio and MIDIjs ready!");
          })
          .catch(error => {
            console.error("Error loading or processing MEI data:", error);
          });
      };
    });
  </script>
</body>
</html>
