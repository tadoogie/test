<!DOCTYPE html>
<html>
<head>
    <title>Test Fixed Toggle Colors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .menu-item {
            margin: 20px 0;
        }
        
        /* CSS rule to ensure inactive state */
        .search-mode-btn {
            background: #666;
            color: #6fc252;
        }
        
        .search-mode-btn:hover {
            opacity: 0.9;
        }
        
        .search-mode-btn.active {
            background: #6fc252 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Presentation Mode Toggle - FIXED</h1>
        <p><strong>Fix Applied:</strong> Added CSS rule for .search-mode-btn base class to ensure #666 background</p>
        
        <div class="menu-item">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-left:8px; margin-bottom: 10px;">
                <span class="displayGroup" style="font-size: 1.2em; font-weight: 600;">Presentation Mode</span>
                <div style="display: flex; gap: 0; width: 120px; border: 2px solid #6fc252; border-radius: 8px; overflow: hidden;">
                    <button id="psModeOff" class="search-mode-btn active" style="flex: 1; background: #6fc252; color: white; border: none; cursor: pointer; font-size: 0.9em; font-weight: 600; padding: 8px; transition: all 0.2s;">
                        Off
                    </button>
                    <button id="psModeOn" class="search-mode-btn" style="flex: 1; background: #666; color: #6fc252; border: none; cursor: pointer; font-size: 0.9em; font-weight: 600; padding: 8px; transition: all 0.2s;">
                        On
                    </button>
                </div>
            </div>
            <input id="psMode" name="presentation" type="checkbox" style="display: none;"/>
            <div style="margin-left:8px;">The unselected button should now show #666 background both on load and after clicking.</div>
        </div>
        
        <div style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
            <strong>Current State:</strong> <span id="statusText">Off</span><br>
            <strong>Checkbox Checked:</strong> <span id="checkboxStatus">false</span>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var psModeOff = document.getElementById("psModeOff");
            var psModeOn = document.getElementById("psModeOn");
            var psModeCheckbox = document.getElementById("psMode");
            var statusText = document.getElementById("statusText");
            var checkboxStatus = document.getElementById("checkboxStatus");
            
            function updateStatus() {
                statusText.textContent = psModeCheckbox.checked ? "On" : "Off";
                checkboxStatus.textContent = psModeCheckbox.checked;
            }
            
            function updateToggleState(activeButton, inactiveButton) {
                activeButton.classList.add("active");
                inactiveButton.classList.remove("active");
                activeButton.style.background = "#6fc252";
                activeButton.style.color = "white";
                inactiveButton.style.background = "#666";
                inactiveButton.style.color = "#6fc252";
            }
            
            if (psModeOff && psModeOn && psModeCheckbox) {
                psModeOff.addEventListener("click", function() {
                    psModeCheckbox.checked = false;
                    psModeCheckbox.dispatchEvent(new Event('change'));
                    updateToggleState(psModeOff, psModeOn);
                    updateStatus();
                });
                
                psModeOn.addEventListener("click", function() {
                    psModeCheckbox.checked = true;
                    psModeCheckbox.dispatchEvent(new Event('change'));
                    updateToggleState(psModeOn, psModeOff);
                    updateStatus();
                });
                
                // Initialize button state based on checkbox
                if (psModeCheckbox.checked) {
                    updateToggleState(psModeOn, psModeOff);
                } else {
                    updateToggleState(psModeOff, psModeOn);
                }
                
                updateStatus();
            }
        });
    </script>
</body>
</html>
