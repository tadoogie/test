<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verovio MIDI Player</title>
  <link href="https://book.verovio.org/tutorials/midi.css" rel="stylesheet" type="text/css" />
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5"></script>

  <script src="js/pdfkit.standalone.js"></script>
  <script src="js/blob-stream.js"></script>
  <script src="js/svg-to-pdfkit.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #notation {
      border: 1px solid #ccc;
      margin-top: 20px;
      overflow-x: auto; /* For horizontal scrolling if content is wider */
    }
    .playing {
      fill: #ff0000; /* Highlight notes in red */
      stroke: #ff0000;
    }

    /* --- CSS for the Paper Size Modal --- */
    #paperSizeModal {
      display: none; /* Hidden by default */
      position: fixed; /* Stay in place */
      z-index: 1000; /* Sit on top */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0,0,0,0.6); /* Black w/ opacity */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
    }

    #paperSizeModal > div {
      background-color: #fefefe;
      margin: auto; /* For browsers that don't support flex centering */
      padding: 30px;
      border: 1px solid #888;
      width: 90%; /* Could be more specific */
      max-width: 350px; /* Max width for larger screens */
      border-radius: 8px;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
      text-align: center;
    }

    #paperSizeModal h2 {
        margin-top: 0;
        color: #333;
    }

    #paperSizeModal label {
        margin-left: 5px;
        font-size: 1.1em;
    }

    #paperSizeModal input[type="radio"] {
        margin-bottom: 10px;
    }

    #paperSizeModal button {
        padding: 10px 20px;
        margin: 10px 5px;
        border: none;
        border-radius: 5px; /* Corrected from 55px to 5px */
        cursor: pointer;
        font-size: 1em;
    }

    #paperSizeModal button#generatePdfButton {
        background-color: #4CAF50; /* Green */
        color: white;
    }

    #paperSizeModal button#generatePdfButton:hover {
        background-color: #45a049;
    }

    #paperSizeModal button#cancelPdfButton {
        background-color: #f44336; /* Red */
        color: white;
    }

    #paperSizeModal button#cancelPdfButton:hover {
        background-color: #da190b;
    }
  </style>
</head>
<body>
  <!-- Version 3.4 -->
  <h1>Hello Verovio!</h1>
  <button id="playMIDI">Play</button>
  <button id="stopMIDI">Stop</button>
  <button id="printPDF">Print</button>
  <div id="notation"></div>

  <div id="paperSizeModal">
    <div>
      <h2>Choose Paper Size</h2>
      <input type="radio" id="paperLetter" name="paperSize" value="LETTER" checked>
      <label for="paperLetter">Letter (8.5" x 11")</label><br><br>
      <input type="radio" id="paperA4" name="paperSize" value="A4">
      <label for="paperA4">A4 (210mm x 297mm)</label><br><br>
      <input type="radio" id="paperA5" name="paperSize" value="A5">
      <label for="paperA5">A5 (148mm x 210mm)</label><br><br>
      <input type="radio" id="paperOctavo" name="paperSize" value="OCTAVO">
      <label for="paperOctavo">Choral (Octavo ~6.75" x 10.5")</label><br><br>
      <button id="generatePdfButton">Generate PDF</button>
      <button id="cancelPdfButton">Cancel</button>
    </div>
  </div>

  <script>
    //Version 5.0 (Direct Tone.js playback and highlighting)
  document.addEventListener("DOMContentLoaded", () => {
    let tk = null;     // Verovio toolkit instance for display
    let tk_pdf = null; // Verovio toolkit instance for PDF generation

    // Initialize a Tone.js synthesizer globally
    // We use PolySynth for polyphony, and toDestination() sends output to speakers.
    const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: {
            type: "sine" // Simple sine wave. Could be "triangle", "sawtooth", etc.
        }
    }).toDestination();

    const printPDF = document.getElementById('printPDF');

    // Get references to modal elements
    const paperSizeModal = document.getElementById('paperSizeModal');
    const generatePdfButton = document.getElementById('generatePdfButton');
    const cancelPdfButton = document.getElementById('cancelPdfButton');

    // Variable to hold the ID of the repeating highlighting event
    let highlightLoopId = null; 

    verovio.module.onRuntimeInitialized = () => {
      // Initialize the display toolkit
      tk = new verovio.toolkit();
      // Initialize the PDF toolkit
      tk_pdf = new verovio.toolkit();

      // Set options for Verovio DISPLAY (how it looks on the webpage)
      tk.setOptions({
        pageWidth: document.body.clientWidth,
        pageHeight: window.innerHeight - 100,
        scale: 70, // Display scale (you can adjust this for your webpage)
        scaleToPageSize: true
      });

      let currentPage = 1;

      // --- Event Handlers for MIDI Playback and Display ---
      const playMIDIHandler = async () => {
        console.log("Play button clicked. Entering playMIDIHandler.");

        // Step 1: Resume the AudioContext (if not already running)
        if (Tone.context.state !== 'running') {
            await Tone.start();
            console.log('AudioContext resumed!');
        } else {
            console.log('AudioContext is already running.');
        }

        // Step 2: Stop any previous playback and clear scheduled events on Tone.Transport
        Tone.Transport.stop();
        Tone.Transport.cancel(); // Clears all notes and events

        // Clear previous highlighting
        document.querySelectorAll('g.note.playing').forEach(note => {
            note.classList.remove("playing");
        });

        // Step 3: Generate MIDI data from Verovio
        let base64midi = tk.renderToMIDI(); 
        console.log("Verovio MIDI data length:", base64midi.length);
        
        // Step 4: Parse the MIDI data using @tonejs/midi
        // Midi.fromBase64 is a convenient way to parse the string
        const midi = new Midi(base64midi); 
        console.log("MIDI data parsed by @tonejs/midi:", midi);

        // Step 5: Schedule all notes from the MIDI file onto Tone.Transport
        midi.tracks.forEach(track => {
            track.notes.forEach(note => {
                // Schedule note playback
                Tone.Transport.scheduleOnce((time) => {
                    synth.triggerAttackRelease(
                        note.name, // e.g., "C4"
                        note.duration, // duration in seconds
                        time, // scheduled time in Tone.Transport's timeline
                        note.velocity // velocity (0-1)
                    );
                }, note.time); // note.time is the start time in seconds
            });
        });

        console.log("MIDI notes scheduled on Tone.Transport.");

        // Step 6: Set up the repeating highlighting loop
        if (highlightLoopId) {
            Tone.Transport.clear(highlightLoopId); // Clear any old loop
        }
        highlightLoopId = Tone.Transport.scheduleRepeat((time) => {
            // `time` here is the current time in Tone.Transport's timeline (seconds)
            // Call the highlighting function with this time
            midiHighlightingHandler(time); 
        }, '8n'); // Update highlighting every eighth note (adjust '8n', '16n', etc., for smoother or less frequent updates)

        // Step 7: Start Tone.js Transport
        Tone.Transport.start(); 
        console.log("Tone.Transport started. Playback and highlighting should begin.");
      };

      const stopMIDIHandler = () => {
        Tone.Transport.stop(); // Stop Tone.js Transport
        Tone.Transport.cancel(); // Clear all scheduled events
        // Clear any active highlighting loop
        if (highlightLoopId) {
            Tone.Transport.clear(highlightLoopId);
            highlightLoopId = null;
        }
        // Remove 'playing' class from all notes
        document.querySelectorAll('g.note.playing').forEach(note => {
          note.classList.remove("playing");
        });
        console.log("Tone.Transport stopped and notes cleared.");
      };

      // This handler now directly receives the time from Tone.Transport
      const midiHighlightingHandler = (currentTimeInSeconds) => {
        console.log("Highlighting event. Current time:", currentTimeInSeconds);
        
        // Remove 'playing' class from previously highlighted notes
        document.querySelectorAll('g.note.playing').forEach(playingNote => {
          playingNote.classList.remove("playing");
        });

        // Get elements at current MIDI time from Verovio (tk instance)
        // Convert seconds to milliseconds for Verovio
        let currentElements = tk.getElementsAtTime(currentTimeInSeconds * 1000); 
        console.log("Elements at current time from Verovio:", currentElements);

        // Page change logic (renders new SVG if page changes)
        if (currentElements.page > 0 && currentElements.page !== currentPage) {
          currentPage = currentElements.page;
          document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage); // Use tk for display rendering
          console.log("Page changed. Now displaying page:", currentPage);
        }
        
        // Add 'playing' class to currently playing notes
        if (currentElements.notes && currentElements.notes.length > 0) {
          console.log("Notes Verovio wants to highlight:", currentElements.notes);
          for (let noteId of currentElements.notes) {
            let noteElement = document.getElementById(noteId);
            if (noteElement) {
              noteElement.classList.add("playing");
            } else {
              console.warn("Could not find note element with ID in DOM for highlighting:", noteId, "Is this note on the current page?", currentPage);
            }
          }
        } else {
          console.log("No notes returned by Verovio for current time (or current page).");
        }
      };

      // --- Load MEI Data and Render SVG ---
      fetch("https://www.verovio.org/examples/downloads/Schubert_Lindenbaum.mei")
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then(meiXML => {
          tk.loadData(meiXML);     // Load data into display toolkit
          tk_pdf.loadData(meiXML); // Load data into PDF toolkit

          // Render the initial SVG for display
          document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);

          // --- Attach Event Listeners and Callbacks after data is loaded ---
          document.getElementById("playMIDI").addEventListener("click", playMIDIHandler);
          document.getElementById("stopMIDI").addEventListener("click", stopMIDIHandler);
          // Removed player.addEventListener('timeupdate', midiHighlightingHandler);
          // Highlighting is now driven by Tone.Transport.scheduleRepeat

          // --- Event Listener for Print Button (shows modal) ---
          printPDF.addEventListener('click', function() {
              paperSizeModal.style.display = 'flex'; // Show the modal using flex for centering
          });

          // --- Event Listener for Cancel Button in Modal ---
          cancelPdfButton.addEventListener('click', function() {
              paperSizeModal.style.display = 'none'; // Hide the modal
          });

          // --- Event Listener for Generate PDF Button in Modal ---
          generatePdfButton.addEventListener('click', async function() {
              paperSizeModal.style.display = 'none'; // Hide the modal
              const selectedSizeElement = document.querySelector('input[name="paperSize"]:checked');
              // Default to 'LETTER' if nothing is selected (shouldn't happen with checked default)
              const selectedPaperSize = selectedSizeElement ? selectedSizeElement.value : 'LETTER'; 

              await generatePDF(selectedPaperSize);
          });

          // --- PDF Generation Logic (moved into a new function) ---
          async function generatePDF(selectedPaperSize) {
              console.log(`Generating PDF for ${selectedPaperSize} paper size...`);

              // IMPORTANT: Use tk_pdf for all PDF-related Verovio operations
              if (!tk_pdf || tk_pdf.getMEI() === '') {
                alert("Verovio PDF toolkit is not ready or no MEI data loaded. Please load a score first.");
                console.error("Verovio PDF Toolkit (tk_pdf) not initialized or MEI data is empty.");
                return;
              }

              try {
                // Store original options from tk_pdf to restore later
                const originalPdfOptions = tk_pdf.getOptions();

                // Define paper size specific options for PDFKit and Verovio
                const paperSizeOptions = {
                    'LETTER': {
                        pdfkitSize: 'LETTER',
                        verovioPageWidth: 800, // Verovio's internal page width
                        verovioPageHeight: 1100 // Verovio's internal page height for Letter aspect ratio
                    },
                    'A4': {
                        pdfkitSize: 'A4',
                        verovioPageWidth: 800, // Keep width consistent
                        verovioPageHeight: 1180 // Slightly taller for A4 aspect ratio
                    },
                    'A5': { // New A5 option
                        pdfkitSize: 'A5', // PDFKit directly supports 'A5'
                        verovioPageWidth: 580, // Adjusted Verovio width for A5
                        verovioPageHeight: 830 // Adjusted Verovio height for A5 (proportional to A4)
                    },
                    'OCTAVO': { // New Choral (Octavo) option
                        pdfkitSize: [486, 756], // Custom size for PDFKit (width, height in points) for 6.75" x 10.5"
                        verovioPageWidth: 640, // Adjusted Verovio width for Octavo
                        verovioPageHeight: 1050 // Adjusted Verovio height for Octavo
                    }
                };

                const currentPaperSettings = paperSizeOptions[selectedPaperSize];

                let doc = new PDFDocument({
                  size: currentPaperSettings.pdfkitSize, // Use selected size for PDFKit
                  layout: 'portrait',
                  margins: { top: 50, bottom: 50, left: 36, right: 36 } // User's preferred margins (0.5 inches)
                });
                
                const stream = doc.pipe(blobStream());
                
                stream.on('finish', function() {
                  const blob = stream.toBlob('application/pdf');
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.style.display = 'none';
                  a.href = url;
                  // Dynamic filename based on selected paper size
                  a.download = `verovio-output-${selectedPaperSize.toLowerCase()}.pdf`; 
                  document.body.appendChild(a);
                  a.click();
                  window.URL.revokeObjectURL(url);
                  document.body.removeChild(a);
                  console.log('PDF download initiated from Verovio SVG.');
                });
                
                stream.on('error', function(err) {
                  console.error("Error creating PDF stream:", err);
                  alert("An error occurred during PDF creation.");
                });
                
                // Set options for Verovio PDF GENERATION (these will *only* apply to the PDF)
                tk_pdf.setOptions({ // <--- Using tk_pdf here
                  scale: 40, // Keep user's preferred music scale
                  pageWidth: currentPaperSettings.verovioPageWidth, // Use selected Verovio page width
                  pageHeight: currentPaperSettings.verovioPageHeight, // Use selected Verovio page height
                  adjustPageHeight: true
                });
                console.log("Verovio PDF options set for PDF generation before rendering pages.");

                const pageCount = tk_pdf.getPageCount(); // <--- Using tk_pdf here
                if (pageCount === 0) {
                  throw new Error("Verovio PDF toolkit reports no pages to render. Check MEI data.");
                }
                console.log("Total pages to render for PDF:", pageCount);

                // Loop through each Verovio page and add its SVG to the PDF
                for (let i = 1; i <= pageCount; i++) {
                  const svgString = tk_pdf.renderToSVG(i); // <--- Using tk_pdf here
                  console.log(`Processing SVG page ${i} from PDF toolkit. Length: ${svgString.length}. First 200 chars:`, svgString.substring(0, 200));

                  if (typeof svgString !== 'string' || svgString.trim() === '' || !svgString.startsWith('<svg')) {
                    console.error(`SVG string for page ${i} from PDF toolkit is invalid or empty:`, svgString);
                    throw new Error(`Invalid or malformed SVG content for page ${i}.`);
                  }

                  const drawableWidth = doc.page.width - doc.page.margins.left - doc.page.margins.right;
                  const drawableHeight = doc.page.height - doc.page.margins.top - doc.page.margins.bottom;
                  
                  await SVGtoPDF(doc, svgString, doc.page.margins.left, doc.page.margins.top, {
                    width: drawableWidth,
                    height: drawableHeight,
                    preserveAspectRatio: 'xMidYMid meet',
                    assumeGIsCursive: true
                  });
                  
                  // No page numbers added here, as confirmed previously it caused a blank page.
                }
                
                doc.end(); // Finalize the PDF document

                tk_pdf.setOptions(originalPdfOptions); // <--- Restore original Verovio PDF options
              } catch (error) {
                console.error("Failed to generate PDF:", error);
                alert("An error occurred during PDF creation.");
              }
          } // end of generatePDF function
        }) // end of fetch .then
        .catch(error => {
          console.error("Error loading or processing MEI data:", error);
        });
    }; // end of verovio.module.onRuntimeInitialized
  }); // end of DOMContentLoaded
  </script>
</body>
</html>
