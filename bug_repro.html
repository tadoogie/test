<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bug Reproduction</title>
<style>
/* Simulate menu.css globals */
html { height: 100%; }
body { height: 100%; margin: 0; font-family: sans-serif; }
body, header, footer { position: relative; }

.container.fluid { display: block; margin: 0 auto; width: 100%; max-width: 1200px; }
.col-sm-12 { float: left; position: relative; min-height: 1px; padding: 15px; width: 100%; box-sizing: border-box; }
.container.fluid:after, .col-sm-12:after { content: ""; display: table; clear: both; }

.title { display: flex; align-items: flex-end; border-bottom: 2px #555 solid; }
.titleText h1 { margin: 0; font-size: 20px; }

/* sidenav is position:fixed - out of flow */
#sidenav { position: fixed; top: 0; right: 0; width: 0; height: 100vh; overflow: hidden; background: #555; }
#menutoggle { position: fixed; top: 18px; right: 22px; width: 46px; height: 46px; background: #555; z-index: 1300; border: none; color: white; }

/* Base controls */
#controls { display: flex; position: absolute; left: 0px; padding: 4px 10px 4px 14px; background: #6fc252; z-index: 10; overflow: visible; }
.vl { display: inline-block; padding: 1px 8px 6px 2px; border-right: 2px solid #000; }
#controls a { padding: 3px 4px; display: inline-block; font-size: 20px; }

/* THE BUG: landscape overflow-x:hidden on .container */
@media (orientation: landscape) and (max-width: 900px) {
  body, html { overflow-x: hidden; max-width: 100vw; }
  .container, .row { max-width: 100vw; overflow-x: hidden; /* THIS forces overflow-y:auto! */ }
}
</style>
</head>
<body class="controls-visible">
<section class="container fluid">
<div class="col-sm-12">
  <div class="title">
    <div class="titleLogo"><img src="" alt="" style="width:50px;height:50px;background:#aaa;margin-right:8px;"/></div>
    <div class="titleText"><h1>Digital Splitleaf Viewer</h1></div>
  </div>
  <button id="menutoggle">☰</button>
  <div id="sidenav"></div>
  <div id="controls">
    <div class="vl">📄 🔗</div>
    <div class="vl">▶️ ⏸ ⏹</div>
    <div class="vl">🎵 ⬆️ ⬇️</div>
  </div>
</div>
</section>
<section style="background:#f5f5f5;padding:20px;">
  <h2>SVG output below</h2>
</section>
<div id="info" style="position:fixed;bottom:8px;left:8px;background:rgba(0,0,0,0.85);color:#fff;padding:8px;font-size:11px;border-radius:4px;z-index:9999;max-width:440px;line-height:1.5;"></div>
<script>
function update() {
  const section = document.querySelector("section.fluid");
  const colsm = document.querySelector(".col-sm-12");
  const ctrl = document.getElementById("controls");
  const scs = window.getComputedStyle(section);
  const ccs = window.getComputedStyle(ctrl);
  const sr = section.getBoundingClientRect();
  const cr = ctrl.getBoundingClientRect();
  const colr = colsm.getBoundingClientRect();
  document.getElementById("info").innerHTML =
    "<b>Viewport:</b> " + window.innerWidth + "×" + window.innerHeight + "<br>" +
    "<b>section.container.fluid:</b> h=" + Math.round(sr.height) + " overflowX=" + scs.overflowX + " overflowY=" + scs.overflowY + "<br>" +
    "<b>.col-sm-12:</b> h=" + Math.round(colr.height) + " overflowY=" + window.getComputedStyle(colsm).overflowY + "<br>" +
    "<b>#controls rect:</b> top=" + Math.round(cr.top) + " h=" + Math.round(cr.height) + " bottom=" + Math.round(cr.bottom) + "<br>" +
    "<b>section bottom:</b> " + Math.round(sr.bottom) + " px from viewport top<br>" +
    "<b>Controls clipped?</b> " + (cr.bottom > sr.bottom ? "YES - extends " + Math.round(cr.bottom - sr.bottom) + "px below section" : "NO");
}
update();
window.addEventListener("resize", update);
</script>
</body>
</html>
