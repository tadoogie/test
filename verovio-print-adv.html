<!DOCTYPE html>
<!-- Version 3.22 -->  
<html>
<head>
  <meta charset="utf-8">
  <title>Verovio MIDI Player</title>
  <link href="https://book.verovio.org/tutorials/midi.css" rel="stylesheet" type="text/css" />
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>

  <script src="js/pdfkit.standalone.js"></script>
  <script src="js/blob-stream.js"></script>
  <script src="js/svg-to-pdfkit.js"></script>
  
  <script src="js/verovio-worker.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/midi-player.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #notation {
      border: 1px solid #ccc;
      margin-top: 20px;
      overflow-x: auto; /* For horizontal scrolling if content is wider */
    }
    .playing {
      fill: #ff0000; /* Highlight notes in red */
      stroke: #ff0000;
    }

    /* --- New CSS for the Paper Size Modal --- */
    #paperSizeModal {
      display: none; /* Changed from 'flex' to 'none' */
      position: fixed; /* Stay in place */
      z-index: 1000; /* Sit on top */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0,0,0,0.6); /* Black w/ opacity */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
      /* display: flex; will be set by JS when needed */
    }

    #paperSizeModal > div {
      background-color: #fefefe;
      margin: auto; /* For browsers that don't support flex centering */
      padding: 30px;
      border: 1px solid #888;
      width: 90%; /* Could be more specific */
      max-width: 350px; /* Max width for larger screens */
      border-radius: 8px;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
      text-align: center;
    }

    #paperSizeModal h2 {
        margin-top: 0;
        color: #333;
    }

    #paperSizeModal label {
        margin-left: 5px;
        font-size: 1.1em;
    }

    #paperSizeModal input[type="radio"] {
        margin-bottom: 10px;
    }

    #paperSizeModal button {
        padding: 10px 20px;
        margin: 10px 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
    }

    #paperSizeModal button#generatePdfButton {
        background-color: #4CAF50; /* Green */
        color: white;
    }

    #paperSizeModal button#generatePdfButton:hover {
        background-color: #45a049;
    }

    #paperSizeModal button#cancelPdfButton {
        background-color: #f44336; /* Red */
        color: white;
    }

    #paperSizeModal button#cancelPdfButton:hover {
        background-color: #da190b;
    }
  </style>
</head>
<body>    
  <h1>Hello Verovio!</h1>
  <button id="loadAudio">Load Audio</button>
  <button id="stopMIDI">Stop</button>   <button id="printPDF">Print</button>
  <midi-player id="verovio-midi-player" sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus" controls="false" style="display: none;">
            </midi-player>
  <div id="notation"></div>

  <div id="paperSizeModal">
    <div>
      <h2>Choose Paper Size</h2>
      <input type="radio" id="paperLetter" name="paperSize" value="LETTER" checked>
      <label for="paperLetter">Letter (8.5" x 11")</label><br><br>
      <input type="radio" id="paperA4" name="paperSize" value="A4">
      <label for="paperA4">A4 (210mm x 297mm)</label><br><br>
      <input type="radio" id="paperA5" name="paperSize" value="A5">
      <label for="paperA5">A5 (148mm x 210mm)</label><br><br>
      <input type="radio" id="paperOctavo" name="paperSize" value="OCTAVO">
      <label for="paperOctavo">Choral (Octavo ~6.75" x 10.5")</label><br><br>
      <button id="generatePdfButton">Generate PDF</button>
      <button id="cancelPdfButton">Cancel</button>
    </div>
  </div>

 <script type="text/javascript">
  // Global variables (ensure these are present in your script)
  var tk; // Main Verovio toolkit instance for display rendering
  var tk_pdf; // For PDF generation (if you use it)
  var currentPage = 1; // Assuming you manage current page
  const player = new MidiPlayer.Player(); // Your MIDI player instance
  const notationDiv = document.getElementById("notation"); // Your notation display div (adjust ID if different)

  // --- NEW/MODIFIED: Web Worker and Timemap Variables ---
  let vrvWorker; // Our Verovio Web Worker instance
  let timemap = []; // This will store the timemap received from the worker
  let timemapIdx = 0; // Index for current position in timemap for highlighting
  let lastReportedTime = 0; // Last time reported by the MIDI player
  let initialMidiLoaded = false; // Flag to ensure MIDI/timemap are requested only once

  // --- Existing: Functions to handle UI interactions (ensure your buttons call these) ---
  // Example for a 'Play' button (replace 'playButton' with your actual button ID)
  document.getElementById('playButton').addEventListener('click', loadAudioAndPlayHandler);
  // Example for a 'Stop' button (replace 'stopButton' with your actual button ID)
  document.getElementById('stopButton').addEventListener('click', () => {
    player.stop();
    // Optional: clear highlighting on stop
    const currentElements = notationDiv.querySelectorAll('.highlighted');
    currentElements.forEach(el => el.classList.remove('highlighted'));
    timemapIdx = 0; // Reset timemap index on stop
  });

  // --- Your MIDI Player Event Listeners (ensure these are set up correctly) ---
  player.on('timeupdate', function(event) {
      if (timemap.length === 0) return; // Don't highlight if timemap isn't loaded yet

      // Convert MIDI Player's tick to approximate time in seconds
      // NOTE: This conversion might need fine-tuning based on your MIDI files and player setup.
      const currentTime = event.tick / player.totalTicks * (player.get='duration'); 
      
      // Prevent rapid re-highlighting for very small time changes
      if (Math.abs(currentTime - lastReportedTime) < 0.05) { // 50ms threshold to reduce DOM updates
          return;
      }
      lastReportedTime = currentTime;

      // Call the highlighting function
      midiHighlightingHandler(currentTime);
  });

  player.on('end', function() {
      console.log('Playback finished.');
      // Remove all highlighting at the end of playback
      const currentElements = notationDiv.querySelectorAll('.highlighted');
      currentElements.forEach(el => el.classList.remove('highlighted'));
      timemapIdx = 0; // Reset for next playback
  });


  // --- MODIFIED: Verovio Initialization and Worker Setup ---
  verovio.module.onRuntimeInitialized = () => {
    // Initialize main toolkit for SVG display rendering (as you currently do)
    tk = new verovio.toolkit();
    tk_pdf = new verovio.toolkit(); // If you use this for PDF generation

    // --- NEW: Initialize the Verovio worker ---
    vrvWorker = new Worker('./verovio-worker.js'); // Path to the worker file you created in Step 1

    // --- NEW: Listen for messages from the worker ---
    vrvWorker.onmessage = (event) => {
      const data = event.data;
      console.log('Main thread received message from worker:', data.cmd, data);

      switch (data.cmd) {
        case 'vrvLoaded':
          // The Verovio toolkit is loaded inside the worker.
          // Now, send the MEI data to the worker and request rendering and timemap.
          console.log('Verovio worker toolkit version:', data.version);
          // Fetch your MEI data here (replace with your actual MEI source)
          fetch("https://www.verovio.org/examples/downloads/Schubert_Lindenbaum.mei") 
            .then(response => response.text())
            .then(meiXML => {
              // --- Send MEI data to the worker and request the timemap ---
              vrvWorker.postMessage({
                cmd: 'updateAll', // This command in worker loads data and renders
                mei: meiXML,
                options: tk.getOptions(), // Send main thread's current options to worker
                requestTimemap: true, // CRUCIAL: Ask the worker to send the timemap
              });

              // --- Keep your existing main thread rendering logic ---
              // Load MEI into the main toolkit for displaying the SVG
              tk.loadData(meiXML);
              tk_pdf.loadData(meiXML); // If you use tk_pdf
              notationDiv.innerHTML = tk.renderToSVG(currentPage); // Render initial SVG
            })
            .catch(error => {
              console.error("Error loading MEI for worker or main thread:", error);
            });
          break;

        case 'updated':
          // The worker has processed an 'updateAll' or 'updateData' command.
          // Check if it sent back the timemap and initial MIDI data.
          if (data.timemap) {
            timemap = data.timemap;
            console.log("Timemap received from worker (updated cmd):", timemap);
            // Now timemap is ready for highlighting
          }
          if (data.midi && !initialMidiLoaded) {
            player.src = 'data:audio/midi;base64,' + data.midi;
            initialMidiLoaded = true;
          }
          break;

        case 'midiPlayback':
          // This command is specifically sent by the worker when it processes an 'exportMidi' request.
          // It contains the MIDI data and the timemap.
          if (data.timemap) {
            timemap = data.timemap;
            console.log("Timemap received from worker (midiPlayback cmd):", timemap);
          }
          if (data.midi) {
            player.src = 'data:audio/midi;base64,' + data.midi;
            initialMidiLoaded = true;
          }
          break;

        // Handle other messages from your worker if needed (e.g., progress updates, errors)
        case 'error':
          console.error('Verovio Worker Error:', data.msg);
          break;
        case 'updateProgressbar':
          console.log(`Worker Progress: ${data.percentage}% for ${data.fileFormat}`);
          break;
      }
    };

    // --- NEW: Tell the worker to load its Verovio toolkit ---
    // Pass the URL to your verovio-toolkit-wasm.js (or similar, e.g., 'verovio-toolkit.js') here.
    // This URL will be used by `importScripts` inside your verovio-worker.js.
    vrvWorker.postMessage({ cmd: 'loadVerovio', url: './verovio-toolkit-wasm.js' }); // Adjust path as needed
  };

  // --- MODIFIED: loadAudioAndPlayHandler to request MIDI/Timemap from worker ---
  const loadAudioAndPlayHandler = async () => {
    player.style.display = 'block'; // Make your player visible

    try {
      await Tone.start(); // Ensure Tone.js AudioContext is resumed
      console.log("Tone.js AudioContext resumed.");
    } catch (error) {
      console.error("Failed to resume Tone.js AudioContext:", error);
      alert("Failed to start audio. Please ensure browser allows autoplay or interact with the page.");
      return;
    }

    // --- NEW: Request MIDI and timemap from the worker if not already loaded ---
    if (!initialMidiLoaded) {
      console.log("Requesting MIDI and timemap from worker for playback...");
      // Send the current MEI data from the main toolkit to the worker.
      // This ensures the worker has the correct MEI state if it needs to re-load for MIDI/timemap generation.
      vrvWorker.postMessage({
        cmd: 'exportMidi',
        options: tk.getOptions(), // Send current options for consistent MIDI generation
        requestTimemap: true, // CRUCIAL: Ask the worker to send the timemap
        mei: tk.getMEI(), // Send the current MEI data (from main thread's tk) to the worker
      });
    }

    // Start playback. The player.src will be set when the worker sends the 'midiPlayback' message.
    player.start();
    console.log("player.start() called.");
  };

  // --- Existing: midiHighlightingHandler (uses the global `timemap` variable) ---
  const midiHighlightingHandler = (currentTime) => {
    let newElementsToHighlight = new Set();

    // Advance timemapIdx to find current active elements
    // The timemap stores times in milliseconds, so convert currentTime (seconds) to milliseconds
    while (timemapIdx < timemap.length && timemap[timemapIdx].t_start <= currentTime * 1000) {
      timemapIdx++;
    }

    // Find all elements that should be active at the current time
    for (let i = 0; i < timemapIdx; i++) {
      const item = timemap[i];
      if (item.t_start <= currentTime * 1000 && item.t_end > currentTime * 1000) {
        // Check if the SVG element exists before adding to set
        if (notationDiv.querySelector('#' + item.id)) {
          newElementsToHighlight.add(item.id);
        }
      }
    }

    // Get currently highlighted elements
    const currentlyHighlighted = notationDiv.querySelectorAll('.highlighted');
    const oldElementsToUnhighlight = new Set();
    currentlyHighlighted.forEach(el => oldElementsToUnhighlight.add(el.id));

    // Remove old highlighting
    oldElementsToUnhighlight.forEach(id => {
      if (!newElementsToHighlight.has(id)) {
        const el = notationDiv.querySelector('#' + id);
        if (el) el.classList.remove('highlighted');
      }
    });

    // Add new highlighting
    newElementsToHighlight.forEach(id => {
      if (!oldElementsToUnhighlight.has(id)) {
        const el = notationDiv.querySelector('#' + id);
        if (el) el.classList.add('highlighted');
      }
    });
  };

  // --- Existing: Helper function for log (from your worker, useful to keep in main script too) ---
  function log(e) {
    console.log('ERROR in Main Script: ', e);
    return;
  }
</script>
</body>
</html>
