<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verovio MIDI Player</title>
  <link href="https://book.verovio.org/tutorials/midi.css" rel="stylesheet" type="text/css" />
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
  <script src="js/pdfkit.standalone.js" type="text/javascript"></script>
  <script src="js/blob-stream.js" type="text/javascript"></script>
  <script src="js/svg-to-pdfkit.js" type="text/javascript"></script>
  <!--<script src="pdf_generator.js"></script>-->
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #notation {
      border: 1px solid #ccc;
      margin-top: 20px;
      overflow-x: auto; /* For horizontal scrolling if content is wider */
    }
    .playing {
      fill: #ff0000; /* Highlight notes in red */
      stroke: #ff0000;
    }
  </style>
</head>
<body>
  <h1>Hello Verovio!</h1>
  <button id="playMIDI">Play</button>
  <button id="stopMIDI">Stop</button>
  <button id="printPDF">Print</button>
  <midi-player id="verovio-midi-player" sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus" controls="false">
            </midi-player>
  <div id="notation"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let tk = null; // Declare tk outside to make it accessible

      const player = document.querySelector('#verovio-midi-player');

      const printPDF = document.getElementById('printPDF');

      verovio.module.onRuntimeInitialized = () => {
        tk = new verovio.toolkit();

        // Set options for Verovio
        tk.setOptions({
          pageWidth: document.body.clientWidth,
          pageHeight: window.innerHeight - 100,
          scale: 70,
          scaleToPageSize: true
        });

        let currentPage = 1;

        // --- Event Handlers ---
        const playMIDIHandler = () => {
          let base64midi = tk.renderToMIDI();
          console.log("Verovio MIDI data length:", base64midi.length);
          console.log("Verovio MIDI data (first 50 chars):", base64midi.substring(0, 50));
          player.src = 'data:audio/midi;base64,' + base64midi;
          player.start();
        };

        const stopMIDIHandler = () => {
          player.stop();
          // Remove highlighting when stopped
          document.querySelectorAll('g.note.playing').forEach(note => {
            note.classList.remove("playing");
          });
        };

        const midiHighlightingHandler = (event) => {
          // Clear previous highlighting
          document.querySelectorAll('g.note.playing').forEach(playingNote => {
            playingNote.classList.remove("playing");
          });

          let currentElements = tk.getElementsAtTime(event.time * 1000); // Verovio expects milliseconds

          // Handle page changes during playback
          if (currentElements.page > 0 && currentElements.page !== currentPage) {
            currentPage = currentElements.page;
            document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);
          }
          
          // Apply highlighting to current notes
          for (let noteId of currentElements.notes) {
            let noteElement = document.getElementById(noteId);
            if (noteElement) {
              noteElement.classList.add("playing");
            }
          }
        };

        // --- Load MEI Data and Render SVG ---
        fetch("https://www.verovio.org/examples/downloads/Schubert_Lindenbaum.mei")
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
          })
          .then(meiXML => {
            tk.loadData(meiXML);
            // Render the initial SVG
            document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);

            // --- Attach Event Listeners and Callbacks after data is loaded ---
            document.getElementById("playMIDI").addEventListener("click", playMIDIHandler);
            document.getElementById("stopMIDI").addEventListener("click", stopMIDIHandler);
            player.addEventListener('timeupdate', midiHighlightingHandler); // This is the crucial change

             printPDF.addEventListener('click', async function() {
                console.log('Button clicked! Generating PDF from Verovio SVG...');

                if (!tk || tk.getMEI() === '') {
                    alert("Verovio is not ready or no MEI data loaded. Please load a score first.");
                    console.error("Verovio Toolkit (tk) not initialized or MEI data is empty.");
                    return;
                }

                try { // <--- Start of the try block

                    // Temporarily store current options to restore later if needed
                    const originalOptions = tk.getOptions();

                    let doc = new PDFDocument({
                        size: 'LETTER',
                        layout: 'portrait',
                        margins: { top: 50, bottom: 50, left: 72, right: 72}
                    });
                    
                    const stream = doc.pipe(blobStream());
                    
                    stream.on('finish', function() {
                        const blob = stream.toBlob('application/pdf');
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = 'verovio-output.pdf';
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        console.log('PDF download initiated from Verovio SVG.');
                    });
                    
                    stream.on('error', function(err) {
                        console.error("Error creating PDF stream:", err);
                        alert("An error occurred during PDF creation.");
                    });
                    
                    // Ensure current Verovio options are set before getting page count
                    tk.setOptions({
                        scale: 60, // Adjust scale for print output
                        pageWidth: 800, // Standard paper width (e.g., for A4/Letter)
                        pageHeight: 1100, // Standard paper height
                        adjustPageHeight: true // Adjusts page height to fit content
                    });
                    console.log("Verovio options set for PDF generation before rendering pages.");

                    const pageCount = tk.getPageCount();
                    if (pageCount === 0) {
                        throw new Error("Verovio reports no pages to render. Check MEI data.");
                    }
                    console.log("Total pages to render:", pageCount);

                    for (let i = 1; i <= pageCount; i++) {
                    // Add a new page ONLY for subsequent pages (i.e., not the very first page)
                    if (i > 1) {
                        doc.addPage({
                            margins: { top: 50, bottom: 50, left: 72, right: 72}
                        });
                        console.log(`--- Added new PDF page for Verovio page ${i}. PDF page count after add: ${doc.bufferedPageRange().start + doc.bufferedPageRange().count}`);
                    }

                    const svgString = tk.renderToSVG(i); // THIS LINE IS CRITICAL
                    console.log(`Processing SVG page ${i}. Length: ${svgString.length}. First 200 chars:`, svgString.substring(0, 200));

                    if (typeof svgString !== 'string' || svgString.trim() === '' || !svgString.startsWith('<svg')) {
                        console.error(`SVG string for page ${i} is invalid or empty:`, svgString);
                        throw new Error(`Invalid or malformed SVG content for page ${i}.`);
                    }

                    // --- NEW DIAGNOSTIC LOGS ADDED IN PREVIOUS STEP ---
                    const drawableWidth = doc.page.width - doc.page.margins.left - doc.page.margins.right;
                    const drawableHeight = doc.page.height - doc.page.margins.top - doc.page.margins.bottom;
                    console.log(`--- SVGtoPDF parameters for Verovio page ${i} (PDF page ${doc.bufferedPageRange().start}):`);
                    console.log(`   - x: ${doc.page.margins.left}`);
                    console.log(`   - y: ${doc.page.margins.top}`);
                    console.log(`   - width: ${drawableWidth}`);
                    console.log(`   - height: ${drawableHeight}`);
                    // --- END NEW DIAGNOSTIC LOGS ---

                    console.log(`--- Before SVGtoPDF for Verovio page ${i}: Current PDF page range:`, doc.bufferedPageRange());

                    await SVGtoPDF(doc, svgString, doc.page.margins.left, doc.page.margins.top, { // THIS LINE IS CRITICAL
                        width: drawableWidth,
                        height: drawableHeight,
                        preserveAspectRatio: 'xMidYMid meet',
                        assumeGIsCursive: true
                    });
                    console.log(`--- After SVGtoPDF for Verovio page ${i}: Current PDF page range: {start: ${doc.bufferedPageRange().start}, count: ${doc.bufferedPageRange().count}}`);

                    doc.fontSize(10).text(`Page ${i} of ${pageCount}`, 0, doc.page.height - 30, {
                        align: 'center',
                        width: doc.page.width
                    });
                    console.log(`--- After page number text for Verovio page ${i}: Current PDF page range: {start: ${doc.bufferedPageRange().start}, count: ${doc.bufferedPageRange().count}}`);
                }

            // Debug logs remain here
            console.log("--- DEBUG: State before final page check ---");
            console.log("doc object (full):", doc);
            console.log("doc.pages property:", doc.pages);

            // --- NEW LOGIC TO HANDLE TRAILING BLANK PAGE ---
            // We know 'pageCount' is the number of actual score pages.
            // If PDFKit adds an implicit page after the last doc.text() for the final score,
            // then the total PDF pages will be 'pageCount + 1'.
            // However, since doc.pages is undefined, we can't directly check doc.pages.length.
            // Instead, we can force a removePage if the bufferedPageRange suggests an extra page was made,
            // or if we just want to remove the last page always, unless it's the only page.

            // Use doc.bufferedPageRange().start as a proxy for the current page index.
            // If the start page is greater than or equal to the actual score page count,
            // it implies an extra page was implicitly added.
            // doc.bufferedPageRange() gives {start: current_page_index, count: number_of_buffered_pages}.
            // So if start is N, it means pages 0 to N-1 are buffered, and N is current.
            // If we have 'pageCount' score pages, and the last doc.text() moved us to 'pageCount',
            // then PDF page 'pageCount' is the blank one.
            
            // Check if the current page index (bufferedPageRange().start) indicates an extra page.
            // If 'pageCount' actual score pages exist, and doc.text moved to 'pageCount' (0-indexed),
            // then there are 'pageCount + 1' total pages (0 to pageCount).
            //if (doc.bufferedPageRange().start === pageCount) {
            //    console.log(`Implicit blank page detected after last score page. Attempting to remove it.`);
            //    doc.removePage(doc.bufferedPageRange().start); // Remove the current (blank) page
            //}
            // --- END OF NEW LOGIC ---

            doc.end();

                    // Restore original options if necessary (optional, but good practice)
                    tk.setOptions(originalOptions);

                } catch (error) { // <--- This catch block MUST directly follow the try block's closing brace
                    console.error("Failed to generate PDF:", error);
                    alert("Failed to generate PDF. Check console for details.");
                }
            }); // <--- Closing brace for printPDF.addEventListener's async function
      

            console.log("Verovio and MIDIjs ready!");
          })
          .catch(error => {
            console.error("Error loading or processing MEI data:", error);
          });
      };
    });
  </script>
</body>
</html>
