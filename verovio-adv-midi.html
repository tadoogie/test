<!DOCTYPE html>
<!-- Version 1.2 -->  
<html>
<head>
  <meta charset="utf-8">
  <title>Verovio MIDI Player</title>
  <link href="https://book.verovio.org/tutorials/midi.css" rel="stylesheet" type="text/css" />
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>

  <script src="js/pdfkit.standalone.js"></script>
  <script src="js/blob-stream.js"></script>
  <script src="js/svg-to-pdfkit.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #notation {
      border: 1px solid #ccc;
      margin-top: 20px;
      overflow-x: auto; /* For horizontal scrolling if content is wider */
    }
    .playing {
      fill: #ff0000; /* Highlight notes in red */
      stroke: #ff0000;
    }

    /* --- New CSS for the Paper Size Modal --- */
    #paperSizeModal {
      display: none; /* Changed from 'flex' to 'none' */
      position: fixed; /* Stay in place */
      z-index: 1000; /* Sit on top */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0,0,0,0.6); /* Black w/ opacity */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
      /* display: flex; will be set by JS when needed */
    }

    #paperSizeModal > div {
      background-color: #fefefe;
      margin: auto; /* For browsers that don't support flex centering */
      padding: 30px;
      border: 1px solid #888;
      width: 90%; /* Could be more specific */
      max-width: 350px; /* Max width for larger screens */
      border-radius: 8px;
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
      text-align: center;
    }

    #paperSizeModal h2 {
        margin-top: 0;
        color: #333;
    }

    #paperSizeModal label {
        margin-left: 5px;
        font-size: 1.1em;
    }

    #paperSizeModal input[type="radio"] {
        margin-bottom: 10px;
    }

    #paperSizeModal button {
        padding: 10px 20px;
        margin: 10px 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
    }

    #paperSizeModal button#generatePdfButton {
        background-color: #4CAF50; /* Green */
        color: white;
    }

    #paperSizeModal button#generatePdfButton:hover {
        background-color: #45a049;
    }

    #paperSizeModal button#cancelPdfButton {
        background-color: #f44336; /* Red */
        color: white;
    }

    #paperSizeModal button#cancelPdfButton:hover {
        background-color: #da190b;
    }
  </style>
</head>
<body>    
  <h1>Hello Verovio!</h1>
  <button id="loadAudio">Load Audio</button>
  <button id="stopMIDI">Stop</button>   <button id="printPDF">Print</button>
  <div style="margin-top: 20px; text-align: center;">
        <midi-player id="myMidiPlayer" sound-font visualizer="#myMidiVisualizer"></midi-player>
        <midi-visualizer type="piano-roll" id="myMidiVisualizer" style="width: 100%; height: 150px;"></midi-visualizer>
    </div>
  <div id="notation"></div>

  <div id="paperSizeModal">
    <div>
      <h2>Choose Paper Size</h2>
      <input type="radio" id="paperLetter" name="paperSize" value="LETTER" checked>
      <label for="paperLetter">Letter (8.5" x 11")</label><br><br>
      <input type="radio" id="paperA4" name="paperSize" value="A4">
      <label for="paperA4">A4 (210mm x 297mm)</label><br><br>
      <input type="radio" id="paperA5" name="paperSize" value="A5">
      <label for="paperA5">A5 (148mm x 210mm)</label><br><br>
      <input type="radio" id="paperOctavo" name="paperSize" value="OCTAVO">
      <label for="paperOctavo">Choral (Octavo ~6.75" x 10.5")</label><br><br>
      <button id="generatePdfButton">Generate PDF</button>
      <button id="cancelPdfButton">Cancel</button>
    </div>
  </div>

 <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- START NEW CODE ADDITION (Part 1: adjustRepeatedNotes function) ---
            /**
             * Adjusts the end times of consecutive identical notes in a NoteSequence
             * to ensure distinct re-triggering during MIDI playback.
             * This is crucial for notes that are repeated immediately after each other,
             * which synthesizers might otherwise interpret as a single, sustained note.
             * @param {object} noteSequence - The Magenta NoteSequence object.
             * @param {number} minGapMs - The minimum gap to introduce in milliseconds. Default is 20ms.
             * @returns {object} A new NoteSequence object with adjusted note timings.
             */
            function adjustRepeatedNotes(noteSequence, minGapMs = 20) {
                // Create a deep copy to avoid modifying the original NoteSequence object.
                // This is important for non-destructive operations.
                const adjustedSequence = JSON.parse(JSON.stringify(noteSequence));

                // Sort notes by start time to ensure correct sequential processing.
                // NoteSequence notes are not guaranteed to be sorted by time, which is essential
                // for correctly identifying consecutive notes. [1]
                const notes = adjustedSequence.notes.sort((a, b) => a.startTime - b.startTime);

                for (let i = 0; i < notes.length - 1; i++) {
                    const currentNote = notes[i];
                    const nextNote = notes[i + 1];

                    // Check for consecutive notes of the exact same pitch.
                    // The problem arises when the same pitch is repeated immediately. [2, 3]
                    if (currentNote.pitch === nextNote.pitch) {
                        // Check if they are contiguous or overlapping.
                        // A small buffer (e.g., -0.0001 seconds) is added to account for
                        // potential floating-point inaccuracies that might make two
                        // theoretically contiguous times appear slightly non-contiguous.
                        if (currentNote.endTime >= nextNote.startTime - 0.0001) {
                            // Define a small epsilon for the micro-gap.
                            // This value (e.g., 20 milliseconds) is converted to seconds,
                            // as NoteSequence times are in seconds. This small gap is
                            // typically imperceptible to the human ear but sufficient
                            // for the synthesizer to register a distinct NoteOff event. [4]
                            const epsilon = minGapMs / 1000; // Convert milliseconds to seconds

                            // Adjust the end time of the current note to create the micro-gap.
                            // The Math.max function ensures that the adjusted end time does not
                            // fall before the start time of the current note, which could
                            // result in a zero or negative duration for very short notes.
                            currentNote.endTime = Math.max(currentNote.startTime, nextNote.startTime - epsilon);
                        }
                    }
                }
                return adjustedSequence;
            }
            // --- END NEW CODE ADDITION (Part 1) ---

            let tk = null;      // Verovio toolkit instance for display
            let tk_pdf = null; // Verovio toolkit instance for PDF generation

            // Define default values for options from user's app-dev snippets
            let zoom = 70; // Set a default for zoom, consistent with your current scale
            let trInterval = 0; // Default transpose interval (no transpose)

            // Correctly reference the new midi-player element
            const player = document.getElementById('myMidiPlayer'); // Changed from #verovio-midi-player
            const loadAudioButton = document.getElementById('loadAudio');
            const stopMIDIButton = document.getElementById('stopMIDI');
            const printPDFButton = document.getElementById('printPDF');

            // Get references to modal elements
            const paperSizeModal = document.getElementById('paperSizeModal');
            const generatePdfButton = document.getElementById('generatePdfButton');
            const cancelPdfButton = document.getElementById('cancelPdfButton');

            // --- START MODIFIED CODE (Highlighting variables) ---
            // Map to store timeouts for unhighlighting notes
            const highlightTimeouts = new Map();
            // --- END MODIFIED CODE (Highlighting variables) ---


            verovio.module.onRuntimeInitialized = () => {
                // Initialize the display toolkit
                tk = new verovio.toolkit();
                // Initialize the PDF toolkit
                tk_pdf = new verovio.toolkit();

                // Calculate pageWidth and pageHeight based on the logic from user's app-dev snippets
                // using the 'zoom' variable
                let pWidth = window.innerWidth;
                let pageWidthBase;
                if (pWidth < 1270) {
                    pageWidthBase = (pWidth - 30) * 100 / zoom;
                } else {
                    pageWidthBase = 1270 * 100 / zoom;
                }
                let pageHeight = window.innerHeight * 100 / zoom;

                // Set options for Verovio DISPLAY (how it looks on the webpage)
                // NOW INCLUDING OPTIONS FROM USER'S APP-DEV SNIPPETS
                tk.setOptions({
                    pageHeight: pageHeight,
                    pageWidth: (pageWidthBase - 100) * 0.96, // Apply the.96 factor
                    scale: zoom, // Use zoom for scale
                    adjustPageHeight: true, // From app-dev snippet
                    transpose: trInterval,   // From app-dev snippet
                    spacingLinear: 0.35,     // From app-dev snippet
                    // Kept original `scaleToPageSize` for display if relevant
                    scaleToPageSize: true
                });

                let currentPage = 1;

                // Unified handler for 'Load Audio' button - displays player AND starts MIDI
                const loadAudioAndPlayHandler = async () => {
                    player.style.display = 'block'; // Make player visible

                    try {
                        await Tone.start(); // Resume AudioContext
                        console.log("Tone.js AudioContext resumed.");
                    } catch (error) {
                        console.error("Failed to resume Tone.js AudioContext:", error);
                        alert("Failed to start audio. Please ensure browser allows autoplay or interact with the page.");
                        return; // Stop if audio context cannot be resumed
                    }

                    // --- START MODIFIED CODE (Inside loadAudioAndPlayHandler) ---
                    // Only load MIDI and play if not already playing or loaded
                    if (!player.noteSequence) { // Check if noteSequence is already set
                        // 1. Get MIDI data from Verovio as a base64 string.
                        // Verovio's `renderToMIDI()` method returns a base64-encoded MIDI file. [5]
                        let base64midi = tk.renderToMIDI(1); // Assuming you want MIDI for the first page
                        console.log("Verovio MIDI data length:", base64midi.length);
                        console.log("Verovio MIDI data (first 50 chars):", base64midi.substring(0, 50));

                        // 2. Convert base64 MIDI to a Magenta.js NoteSequence.
                        // Magenta.js provides `midiToSequenceProto` for this conversion. [1]
                        const midiBytes = new Uint8Array(atob(base64midi).split('').map(char => char.charCodeAt(0)));
                        const originalNoteSequence = await mm.midiToSequenceProto(midiBytes);

                        // 3. Adjust the NoteSequence to handle repeated notes.
                        const adjustedNoteSequence = adjustRepeatedNotes(originalNoteSequence);

                        // 4. Assign the adjusted NoteSequence to the player.
                        // The `html-midi-player` uses the `noteSequence` property to load the data. [6]
                        player.noteSequence = adjustedNoteSequence;
                    }
                    // --- END MODIFIED CODE (Inside loadAudioAndPlayHandler) ---

                    player.start();
                    console.log("player.start() called."); // Confirm player.start() is invoked
                };

                const stopMIDIHandler = () => {
                    player.stop();
                    // --- START MODIFIED CODE (stopMIDIHandler: Clear all highlights and timeouts) ---
                    // Clear all highlights from the DOM
                    document.querySelectorAll('g.note.playing').forEach(note => {
                        note.classList.remove("playing");
                    });
                    // Clear all scheduled unhighlighting timeouts
                    highlightTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
                    highlightTimeouts.clear();
                    // --- END MODIFIED CODE (stopMIDIHandler) ---
                    console.log("MIDI stopped. All highlights cleared.");
                };

                // --- START MODIFIED CODE (midiHighlightingHandler) ---
                // This handler will now primarily use 'note' events for precise highlighting
                const midiHighlightingHandler = (event) => {
                    // Only process 'note' events for highlighting individual notes
                    if (event.type === 'note') {
                        const noteData = event.detail.note;
                        const noteStartTimeMs = noteData.startTime * 1000;
                        const noteEndTimeMs = noteData.endTime * 1000;

                        // Get all elements at the note's start time from Verovio
                        // This will return all notes (and other elements) that are active at this precise millisecond.
                        let elementsAtCurrentTime = tk.getElementsAtTime(noteStartTimeMs);
                        let notesToHighlight = elementsAtCurrentTime.notes;

                        // console.log(`Note event! MIDI Note: ${noteData.pitch}, Time: ${noteData.startTime}s, Duration: ${noteData.endTime - noteData.startTime}s`);
                        // console.log(`Verovio elements at note start time ${noteStartTimeMs}ms:`, notesToHighlight);

                        // Highlight notes that just started
                        notesToHighlight.forEach(noteId => {
                            const noteElement = document.getElementById(noteId);
                            if (noteElement) {
                                noteElement.classList.add("playing");
                                // Schedule unhighlighting for this specific note at its end time
                                // The delay is calculated from the current player time to ensure accuracy.
                                const delay = noteEndTimeMs - player.currentTime * 1000;
                                if (delay > 0) { // Only schedule if the note hasn't already ended
                                    const timeoutId = setTimeout(() => {
                                        if (noteElement.classList.contains("playing")) {
                                            noteElement.classList.remove("playing");
                                        }
                                        highlightTimeouts.delete(noteId); // Clean up the map
                                    }, delay);

                                    highlightTimeouts.set(noteId, timeoutId); // Store timeout ID
                                } else {
                                    // If delay is 0 or negative, the note has already ended or is a very short note
                                    // that might have been missed by the event loop. Ensure it's not highlighted.
                                    if (noteElement.classList.contains("playing")) {
                                        noteElement.classList.remove("playing");
                                    }
                                }
                            } else {
                                console.log("Note element NOT found for ID:", noteId);
                            }
                        });

                        // Page turning logic (still active as it's not part of the highlighting class logic)
                        // This can still use the general timeupdate or note event's startTime
                        const pageForCurrentTime = elementsAtCurrentTime.page;
                        if (pageForCurrentTime > 0 && pageForCurrentTime!== currentPage) {
                            currentPage = pageForCurrentTime;
                            document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);
                        }
                    }
                    // We no longer use 'timeupdate' for granular highlighting, but it could be used for other UI updates if needed.
                    // The previous 'timeupdate' logic for highlighting is now replaced by the 'note' event logic above.
                };
                // --- END MODIFIED CODE (midiHighlightingHandler) ---

                // --- Load MEI Data and Render SVG ---
                fetch("https://www.verovio.org/examples/downloads/Schubert_Lindenbaum.mei")
                  .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    })
                  .then(meiXML => {
                        tk.loadData(meiXML);      // Load data into display toolkit
                        tk_pdf.loadData(meiXML); // Load data into PDF toolkit

                        // Render the initial SVG for display
                        document.getElementById("notation").innerHTML = tk.renderToSVG(currentPage);

                        // --- Attach Event Listeners and Callbacks after data is loaded ---
                        loadAudioButton.addEventListener("click", loadAudioAndPlayHandler);
                        stopMIDIButton.addEventListener("click", stopMIDIHandler);

                        // Attach ONLY 'note' listener for highlighting. Remove 'timeupdate' for highlighting.
                        player.addEventListener('note', midiHighlightingHandler);
                        // If you need timeupdate for other UI elements (e.g., progress bar updates), you can keep it,
                        // but ensure it doesn't interfere with note highlighting.
                        // player.addEventListener('timeupdate', someOtherTimeUpdateHandler);
                        console.log("Attached 'note' listener to midi-player for highlighting.");

                        // --- Event Listener for Print Button (shows modal) ---
                        printPDFButton.addEventListener('click', function() {
                            paperSizeModal.style.display = 'flex'; // Show the modal using flex for centering
                        });

                        // --- Event Listener for Cancel Button in Modal ---
                        cancelPdfButton.addEventListener('click', function() {
                            paperSizeModal.style.display = 'none'; // Hide the modal
                        });

                        // --- Event Listener for Generate PDF Button in Modal ---
                        generatePdfButton.addEventListener('click', async function() {
                            paperSizeModal.style.display = 'none'; // Hide the modal
                            const selectedSizeElement = document.querySelector('input:checked'); // Corrected selector
                            const selectedPaperSize = selectedSizeElement? selectedSizeElement.value : 'LETTER';

                            await generatePDF(selectedPaperSize);
                        });

                        // --- PDF Generation Logic (moved into a new function) ---
                        async function generatePDF(selectedPaperSize) {
                            console.log(`Generating PDF for ${selectedPaperSize} paper size...`);

                            if (!tk_pdf |

| tk_pdf.getMEI() === '') {
                                alert("Verovio PDF toolkit is not ready or no MEI data loaded. Please load a score first.");
                                console.error("Verovio PDF Toolkit (tk_pdf) not initialized or MEI data is empty.");
                                return;
                            }

                            try {
                                const originalPdfOptions = tk_pdf.getOptions();

                                const paperSizeOptions = {
                                    'LETTER': {
                                        pdfkitSize: 'LETTER',
                                        verovioPageWidth: 2000,
                                        verovioPageHeight: 1100,
                                        verovioScale: 40
                                    },
                                    'A4': {
                                        pdfkitSize: 'A4',
                                        verovioPageWidth: 2000,
                                        verovioPageHeight: 1180,
                                        verovioScale: 40
                                    },
                                    'A5': {
                                        pdfkitSize: 'A5',
                                        verovioPageWidth: 2000,
                                        verovioPageHeight: 830,
                                        verovioScale: 40
                                    },
                                    'OCTAVO': {
                                        pdfkitSize: , // Corrected from empty array
                                        verovioPageWidth: 2000,
                                        verovioPageHeight: 1050,
                                        verovioScale: 40
                                    }
                                };

                                const currentPaperSettings = paperSizeOptions; // Corrected to use selectedSize

                                let doc = new PDFDocument({
                                    size: currentPaperSettings.pdfkitSize,
                                    layout: 'portrait',
                                    margins: { top: 10, bottom: 10, left: 10, right: 10 }
                                });

                                const stream = doc.pipe(blobStream());

                                stream.on('finish', function() {
                                    const blob = stream.toBlob('application/pdf');
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.style.display = 'none';
                                    a.href = url;
                                    a.download = `verovio-output-${selectedPaperSize.toLowerCase()}.pdf`;
                                    document.body.appendChild(a);
                                    a.click();
                                    window.URL.revokeObjectURL(url);
                                    document.body.removeChild(a);
                                    console.log('PDF download initiated from Verovio SVG.');
                                });

                                stream.on('error', function(err) {
                                    console.error("Error creating PDF stream:", err);
                                    alert("An error occurred during PDF creation.");
                                });

                                tk_pdf.setOptions({
                                    scale: currentPaperSettings.verovioScale,
                                    pageWidth: currentPaperSettings.verovioPageWidth,
                                    pageHeight: currentPaperSettings.verovioPageHeight,
                                    adjustPageHeight: true
                                });
                                console.log("Verovio PDF options set for PDF generation before rendering pages.");

                                const pageCount = tk_pdf.getPageCount();
                                if (pageCount === 0) {
                                    throw new Error("Verovio PDF toolkit reports no pages to render. Check MEI data.");
                                }
                                console.log("Total pages to render for PDF:", pageCount);

                                for (let i = 1; i <= pageCount; i++) {
                                    const svgString = tk_pdf.renderToSVG(i);
                                    console.log(`Processing SVG page ${i} from PDF toolkit. Length: ${svgString.length}. First 200 chars:`, svgString.substring(0, 200));

                                    if (typeof svgString!== 'string' |

| svgString.trim() === '' ||!svgString.startsWith('<svg')) {
                                        console.error(`SVG string for page ${i} from PDF toolkit is invalid or empty:`, svgString);
                                        throw new Error(`Invalid or malformed SVG content for page ${i}.`);
                                    }

                                    const drawableWidth = doc.page.width - doc.page.margins.left - doc.page.margins.right;
                                    const drawableHeight = doc.page.height - doc.page.margins.top - doc.page.margins.bottom;

                                    await SVGtoPDF(doc, svgString, doc.page.margins.left, doc.page.margins.top, {
                                        width: drawableWidth,
                                        height: drawableHeight,
                                        preserveAspectRatio: 'xMidYMid meet',
                                        assumeGIsCursive: true
                                    });
                                }

                                doc.end();

                                tk_pdf.setOptions(originalPdfOptions);
                            } catch (error) {
                                console.error("Failed to generate PDF:", error);
                                alert("Failed to generate PDF. Check console for details.");
                            }
                        }
                    })
                  .catch(error => {
                        console.error("Error loading or processing MEI data:", error);
                    });
            }; // End of verovio.module.onRuntimeInitialized
        }); // End of DOMContentLoaded
    </script>
</body>
</html>
