        <div class="tab-container">
            <button class="tablink" onclick="location.href='index.html'">HOME</button>
            <button class="tablink" onclick="location.href='about.html'">ABOUT</button>
            <button class="tablink" onclick="location.href='events.html'">EVENTS</button>
            <button class="tablink" onclick="" disabled="disabled">BLOG</button>
            <button class="tablink" onclick="location.href='community.html'">COMMUNITY</button>
            <button class="tablink" onclick="location.href='contact.html'">CONTACT</button>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var page = window.location.pathname.split('/').pop() || 'index.html';
                document.querySelectorAll('.tab-container .tablink').forEach(function(btn) {
                    var m = (btn.getAttribute('onclick') || '').match(/location\.href='([^']+)'/);
                    if (m && m[1] === page) { btn.classList.add('active'); }
                });
            });
        </script>
        
        <div data-template="templates:insert" data-template-at="content"/>
        
        </div>
