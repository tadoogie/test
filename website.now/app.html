            body, header, footer { position: relative; }
            /* iPhone portrait: controls sidebar overflows the bottom of the viewport because
               the CDN CSS uses height:calc(100vh+12px) / height:100vh, but on iOS Safari
               100vh = the large viewport height (address bar hidden). When the address bar is
               visible the sidebar is ~50px taller than the screen (observed: bottom = -25px).
               Fix: position:fixed with top:0 + bottom:0 + height:auto always fills exactly
               the real visible viewport, adapting as the address bar shows/hides. */
            @media (max-width: 800px) and (orientation: portrait) {
                 html {
                    overflow-x: hidden;
                    max-width: 100vw;
                }
                
                #controls {
                    top: 0;
                    bottom: 0;
                    height: auto !important;
                }
                /* Fix gap: CDN CSS applies margin-left:30px to both .container AND #svg_output,
                   totalling 75px offset when the controls sidebar is only 60px wide (15px gap).
                   Set container margin to exactly the sidebar width and neutralise the direct
                   svg_output margin so content aligns flush with the right edge of the sidebar. */
                body.controls-visible .container {
                    margin-left: 60px !important;
                    max-width: calc(100% - 60px) !important;
                }
                body.controls-visible #svg_output,
                body.controls-visible .title {
                    margin-left: 0 !important;
                }
            }
            /* iPhone landscape: the horizontal controls bar (position:absolute inside
               .col-sm-12) is cut off — only ~1/3 of its height is visible. The bar's
               bottom portion extends past .col-sm-12's bottom edge; the CDN CSS has
               overflow:hidden on that column, so only the ~15px padding-bottom strip
               of the column shows the bar. Fix: override overflow to visible so the
               bar can extend below the column boundary. The bar's z-index:10 already
               ensures it paints above any following sections. */
            @media (max-width: 1023px) and (orientation: landscape) {
                .container, .row, .col-sm-12 {
                    overflow: visible !important;
                }
                body{
                    overflow-x: visible !important;
                }
            }
            /* iPhone: prevent transition:all on containers during orientation change.
               CDN CSS uses transition:all on .container/.row/.col-* which animates width and
               max-width simultaneously as the viewport resizes, causing iOS Safari to
               misread intermediate layout values and zoom in massively. */
            @media (max-width: 900px) {
                 html {
                    overflow-x: hidden;
                    max-width: 100vw;
                }
                
                .container, .row, .col-sm-12, .col-lg-12 {

            }
            
            .contourBtnSub {
                font-weight: normal;
                text-transform: uppercase;
                font-size: 18px;
            }

            /* Text-only mode: gray out music controls (2nd .vl onwards), keep PDF+Share active */
            #controls.text-only-mode .vl:not(:first-child) {
                opacity: 0.35;
                pointer-events: none;
            }
            #controls.text-only-mode .vl:not(:first-child) .icon {
                fill: #888 !important;
                color: #888 !important;
            }
            #controls.text-only-mode .vl:not(:first-child) .icon path,
            #controls.text-only-mode .vl:not(:first-child) .icon polygon,
            #controls.text-only-mode .vl:not(:first-child) .icon rect,
            #controls.text-only-mode .vl:not(:first-child) svg path,
            #controls.text-only-mode .vl:not(:first-child) svg polygon {
                fill: #888 !important;
                stroke: none !important;
            }
            #controls.text-only-mode .vl:not(:first-child) .icon-TransposeUpArrow,
            #controls.text-only-mode .vl:not(:first-child) .icon-TransposeDwnArrow {
                color: #888 !important;
            }

            /* TEXT ONLY button — same style as GO button */
            .text-only-btn {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 8px 10px;
                background: transparent;
                color: #6fc252;
                border: none;
                cursor: pointer;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            .text-only-btn svg {
                width: 28px;
                height: 28px;
                fill: #6fc252;
                stroke: #6fc252;
                display: block;
            }
            .text-only-btn:hover { opacity: 0.9; }
            .text-only-btn:active { transform: translateY(1px); }

            /* Put TEXT ONLY on the left and NEXT on the right */
            .next-btn-row.has-two-btns {
                justify-content: space-between !important;
                width: 100%;
            }

            /* Text-only output display */
            .cetei-text-output {
                padding: 20px;
                font-size: 1.1em;
                line-height: 1.8;
                color: #222;
            }
            .cetei-verse { margin-bottom: 1.2em; }
            .cetei-line { margin: 0; }
            .cetei-title { margin: 0 0 0.8em 0; font-size: 1.4em; }
            .cetei-source { margin-top: 1.5em; font-size: 0.95em; color: #444; border-top: 1px solid #ccc; padding-top: 0.6em; }

            /* ── Tonic Sol-fa output ─────────────────────────────────────────── */
            .solfa-output {
                padding: 20px;
                font-family: 'Courier New', Courier, monospace;
            }
            .solfa-title {
                font-size: 1.3em;
                margin: 0 0 0.3em 0;
                color: #222;
            }
            .solfa-meta {
                font-size: 0.9em;
                color: #555;
                margin: 0 0 1.2em 0;
            }
            .solfa-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .solfa-table {
                border-collapse: collapse;
                border: none;
                width: max-content;
            }
            .solfa-table td,
            .solfa-table th {
                border: none;
                padding: 1px 3px;
                text-align: left;
                min-width: 2.5em;
                vertical-align: bottom;
            }
            .solfa-brace-wrap {
                display: flex;
                align-items: stretch;
            }
            .solfa-brace-col {
                position: relative;
                width: 18px;
                flex-shrink: 0;
                align-self: stretch;
            }
            .solfa-brace {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
            .solfa-row-pitch .solfa-cell {
                font-size: 1.15em;
                font-weight: 700;
                line-height: 1.6;
                color: #111;
            }
            .solfa-row-text .solfa-cell.solfa-word {
                font-size: 0.82em;
                color: #333;
                line-height: 1.4;
            }
            .solfa-table td.solfa-bar-end,
            .solfa-table th.solfa-bar-end {
                border-right: 1.5px solid #333;
            }
            .solfa-rest {
                color: #888;
            }
            .solfa-held {
                color: #aaa;
            }
            .solfa-syl {
                display: inline;
            }
            /* Octave markers: superscript primes for higher, subscript commas for lower */
            .solfa-oct-hi {
                font-size: 0.5em;
                vertical-align: super;
                font-weight: 800;
                letter-spacing: -0.1em;
            }
            .solfa-oct-lo {
                font-size: 0.6em;
                font-weight: 800;
                letter-spacing: -0.1em;
            }
            /* Spacer row between voice parts */
            .solfa-spacer td {
                height: 10px;
            }
            /* Error message */
            .solfa-error {
                padding: 20px;
                color: #d32f2f;
                font-size: 1em;
            }
            /* Beat-position prefix inside note cells (':' / '|') and sub-note
               prefixes within a beat ('.' half-beat, ',' finer subdivision) */
            .solfa-beat-pre {
                font-size: 0.8em;
                color: #888;
                font-weight: 400;
                margin-right: 1px;
            }
            /* Slur: underline the note characters (solfa + octave), excluding beat prefix */
            .solfa-slur {
                text-decoration: underline;
                text-underline-offset: 2px;
                text-decoration-thickness: 1px;
            }
        </style>

        function openNav() {

          var sidenav = document.getElementById("sidenav");
          var menutoggle = document.getElementById("menutoggle");
          sidenav.style.width = "0";
          menutoggle.classList.remove("is-active");

        document.addEventListener("DOMContentLoaded", function() {
          // Awesomplete setup removed for pssource (hidden field, no autocomplete needed)

          // Sidenav push logic
           var sidenav = document.getElementById("sidenav");
           var main = document.getElementById("main");
           var menutoggle = document.getElementById("menutoggle");
           var closemenu = document.getElementById("closemenu");
        
           menutoggle.addEventListener("click", function() {
             stopMIDIHandler();
             if (!menutoggle.classList.contains("is-active")) {
               openNav();
             } else {
               closeNav();
             }
           });
           document.addEventListener("keydown", function(e) {
             if (e.key === "Escape") closeNav();
           });
           
           // Presentation Mode toggle buttons
           var psModeOff = document.getElementById("psModeOff");
           var psModeOn = document.getElementById("psModeOn");
           var psModeCheckbox = document.getElementById("psMode");
           
           function updateToggleState(activeButton, inactiveButton) {
             activeButton.classList.add("active");
             inactiveButton.classList.remove("active");
             activeButton.style.background = "#6fc252";
             inactiveButton.style.background = "#666";
           }
           
           if (psModeOff &amp;&amp; psModeOn &amp;&amp; psModeCheckbox) {
             psModeOff.addEventListener("click", function() {
               psModeCheckbox.checked = false;
               psModeCheckbox.dispatchEvent(new Event('change'));
               updateToggleState(psModeOff, psModeOn);
             });
             
             psModeOn.addEventListener("click", function() {
               psModeCheckbox.checked = true;
               psModeCheckbox.dispatchEvent(new Event('change'));
               updateToggleState(psModeOn, psModeOff);
             });
             
             // Initialize button state based on checkbox
             if (psModeCheckbox.checked) {
               updateToggleState(psModeOn, psModeOff);
             } else {
               updateToggleState(psModeOff, psModeOn);
             }
           }

           // Notation toggle buttons (Staff / Sol-fa)
           var notationStaffBtn = document.getElementById("notationStaff");
           var notationSolfaBtn = document.getElementById("notationSolfa");

           if (notationStaffBtn &amp;&amp; notationSolfaBtn) {
             notationStaffBtn.addEventListener("click", function() {
               updateToggleState(notationStaffBtn, notationSolfaBtn);
               if (typeof exitSolfaView === 'function') exitSolfaView();
             });

             notationSolfaBtn.addEventListener("click", function() {
               updateToggleState(notationSolfaBtn, notationStaffBtn);
               if (typeof loadSolfaView === 'function') loadSolfaView();
             });

             // Staff is the default active state (already set in HTML)
             updateToggleState(notationStaffBtn, notationSolfaBtn);
           }
