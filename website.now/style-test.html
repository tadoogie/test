            /* Tooltip text */
            .tooltip .tooltiptext {
              visibility: hidden;
              background: rgba(0,0,0,0.7);
              color: #fff;
              text-align: center;
              border-radius: 6px;
              padding: 5px 8px;
             
              /* Position the tooltip text - see examples below! */
              position: absolute;
              z-index: 1;
              top: 100%;
              left: 50%;
              margin-left: -30px;
            }
            
            /* Show the tooltip text when you mouse over the tooltip container */
            .tooltip:hover .tooltiptext {

<section class="container">
    <div class="col-lg-12">
    <div class="svg_output" id="svg_output">
        <h2>Getting Started</h2>
        <ol>
            <li>Select the Psalm text or metre for the text you wish to sing by clicking on "Type here". Typing in either of these box will allow you to search the available options. (NOTE: Firefox users will need to press the enter key after selecting the text.)</li>
            <li>Select a <strong>minimum of two</strong> verses you wish to sing from the "Verses" section. (NOTE: these are the biblical verses, not the stanzas)</li>
            <li>Select a tune. When a tune has been suggested for a particular psalm, that is provided by default. However, you may select any other tune from the "Tune" dropdown.</li>
            <li>Click on "View Psalm" to show your text and tune selections</li>
        </ol>
    </div>
</div>
